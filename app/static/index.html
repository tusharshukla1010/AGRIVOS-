function BookingDrawer({bookings,onClose,onCancel}){const[cancelling,setCancelling]=useState(null);const cancel=async id=>{setCancelling(id);await onCancel(id);setCancelling(null)};return <div className="fixed inset-0 z-50 flex justify-end bg-forest/30" onClick={onClose}><aside onClick={e=>e.stopPropagation()} className="fade h-full w-full max-w-xl overflow-y-auto bg-white p-6 shadow-2xl sm:p-8"><div className="flex items-start justify-between"><div><p className="text-xs font-bold uppercase tracking-[.2em] text-leaf">Your bookings</p><h2 className="mt-2 text-3xl font-bold">My bookings</h2><p className="mt-2 text-sm text-slate-500">See your booking details, queue position, and progress.</p></div><button onClick={onClose} className="rounded-lg p-2 text-slate-400 hover:bg-mist"><Icon name="x"/></button></div>{bookings.length===0?<div className="mt-10 rounded-2xl bg-mist p-6 text-center text-sm text-slate-500">You have no active bookings yet. Choose a centre below when you are ready to book.</div>:<div className="mt-8 space-y-4">{bookings.map(b=><article key={b.id} className="rounded-2xl border border-slate-200 p-5"><div className="flex items-start justify-between gap-4"><div><p className="text-xs uppercase tracking-wide text-slate-400">Digital token</p><p className="mt-1 text-3xl font-bold text-forest">{b.token}</p></div><Badge tone={b.status==='completed'?'green':'amber'}>{b.status.replace('_',' ')}</Badge></div><div className="mt-5 grid gap-3 text-sm sm:grid-cols-2"><div><p className="text-xs text-slate-400">Centre</p><p className="font-semibold">{b.centre_name}</p><p className="text-slate-500">{b.district} · {b.crop}</p></div><div><p className="text-xs text-slate-400">Slot</p><p className="font-semibold">{b.slot_date}</p><p className="text-slate-500">{b.start_time}–{b.end_time}</p></div><div><p className="text-xs text-slate-400">Queue</p><p className="font-semibold">#{b.queue_no} · {b.queue_ahead} ahead</p><p className="text-slate-500">Estimated wait {Math.round(b.eta_minutes||0)} min</p></div><div><p className="text-xs text-slate-400">Produce</p><p className="font-semibold">{b.quantity_kg} kg</p><p className="text-slate-500">{b.vehicle_no||'No vehicle number added'}</p></div></div>{b.status!=='cancelled'&&<button disabled={b.status!=='booked'||cancelling===b.id} onClick={()=>b.status==='booked'&&cancel(b.id)} className="mt-5 rounded-xl border border-red-100 px-4 py-2 text-sm font-semibold text-red-600 hover:bg-red-50 disabled:cursor-not-allowed disabled:opacity-50">{cancelling===b.id?'Cancelling...':b.status==='booked'?'Cancel booking':"You can't cancel after you've arrived"}</button>}</article>)}</div>}</aside></div>}
function BookingPanel({mode,bookings,history,notifications,onClose,onCancel}){const records=mode==='active'?bookings:history;const readableStatus=s=>({booked:'Booked',arrived:'Arrived at centre',weighment:'Being weighed',quality_check:'Quality check',payment:'Payment processing',completed:'Completed',cancelled:'Cancelled'}[s]||s);return <div className="fixed inset-0 z-50 flex justify-end bg-forest/30" onClick={onClose}><aside onClick={e=>e.stopPropagation()} className="fade h-full w-full max-w-xl overflow-y-auto bg-white p-6 shadow-2xl sm:p-8"><div className="flex items-start justify-between"><div><p className="text-xs font-bold uppercase tracking-[.2em] text-leaf">Your bookings</p><h2 className="mt-2 text-3xl font-bold">{mode==='active'?'Current bookings':mode==='history'?'Past bookings':'Notifications'}</h2><p className="mt-2 text-sm text-slate-500">{mode==='active'?'Bookings you still need to complete.':mode==='history'?'Completed and cancelled bookings, all in one place.':"We'll keep you posted about your bookings."}</p></div><button onClick={onClose} className="rounded-lg p-2 text-slate-400 hover:bg-mist"><Icon name="x"/></button></div>{mode==='notifications'?(notifications.length===0?<div className="mt-10 rounded-2xl bg-mist p-6 text-center text-sm text-slate-500">No notifications yet.</div>:<div className="mt-8 space-y-3">{notifications.map(n=><article key={n.id} className="rounded-2xl border border-slate-200 p-4"><div className="flex items-start justify-between gap-3"><div><p className="font-bold">{n.title.replace('✓','')}</p><p className="mt-1 text-sm leading-6 text-slate-600">{n.message}</p></div><Badge tone={n.kind==='alert'?'amber':'green'}>{n.kind==='success'?'Success':'Update'}</Badge></div><p className="mt-3 text-xs text-slate-400">{new Date(n.created_at).toLocaleString('en-IN')}</p></article>)}</div>):records.length===0?<div className="mt-10 rounded-2xl bg-mist p-6 text-center text-sm text-slate-500">{mode==='active'?'You have no active bookings. Choose a centre to book a slot.':'Completed and cancelled bookings will appear here.'}</div>:<div className="mt-8 space-y-4">{records.map(b=><article key={b.id} className="rounded-2xl border border-slate-200 p-5"><div className="flex items-start justify-between gap-4"><div><p className="text-xs uppercase tracking-wide text-slate-400">Booking token</p><p className="mt-1 text-2xl font-bold text-forest">{b.token}</p></div><Badge tone={b.status==='completed'?'green':'amber'}>{readableStatus(b.status)}</Badge></div><div className="mt-5 grid gap-3 text-sm sm:grid-cols-2"><div><p className="text-xs text-slate-400">Centre</p><p className="font-semibold">{b.centre_name}</p><p className="text-slate-500">{b.district} · {b.crop}</p></div><div><p className="text-xs text-slate-400">Scheduled visit</p><p className="font-semibold">{b.slot_date}</p><p className="text-slate-500">{b.start_time}–{b.end_time}</p></div><div><p className="text-xs text-slate-400">Produce</p><p className="font-semibold">{b.quantity_kg} kg</p><p className="text-slate-500">{b.vehicle_no||'No vehicle number added'}</p></div><div><p className="text-xs text-slate-400">Queue</p><p className="font-semibold">Position {b.queue_no}</p><p className="text-slate-500">{b.status==='completed'?'Procurement completed':'Estimated wait '+Math.round(b.eta_minutes||0)+' minutes'}</p></div></div>{mode==='active'&&<button disabled={b.status!=='booked'} onClick={()=>b.status==='booked'&&onCancel(b.id)} className="mt-5 rounded-xl border border-red-100 px-4 py-2 text-sm font-semibold text-red-600 hover:bg-red-50 disabled:cursor-not-allowed disabled:opacity-50">{b.status==='booked'?'Cancel booking':"You can't cancel after you've arrived"}</button>}</article>)}</div>}</aside></div>}
function BookingNavigation(){const[mode,setMode]=useState(null),[bookings,setBookings]=useState([]),[history,setHistory]=useState([]),[notifications,setNotifications]=useState([]);const token=()=>localStorage.getItem('agrivos_token')||'';const load=async next=>{if(next==='active')setBookings(await api('/bookings',{},token()));if(next==='history')setHistory(await api('/bookings/history',{},token()));if(next==='notifications')setNotifications(await api('/notifications',{},token()));setMode(next)};useEffect(()=>{const click=e=>{const link=e.target.closest('a');const label=link?.textContent.trim();if(label==='My bookings'||label==='History'||label==='Notifications'){e.preventDefault();load(label==='My bookings'?'active':label.toLowerCase())}};document.addEventListener('click',click);return()=>document.removeEventListener('click',click)},[]);const cancel=async id=>{await api('/bookings/'+id+'/cancel',{method:'POST'},token());await load('active')};return mode?<BookingPanel mode={mode} bookings={bookings} history={history} notifications={notifications} onClose={()=>setMode(null)} onCancel={cancel}/>:null}

const api=async(path,options={},token='')=>{const r=await fetch('/api'+path,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Something went wrong');return d};

function LegacyAuth({onLogin}){const[mode,setMode]=useState('login'),[form,setForm]=useState({}),[error,setError]=useState(''),[busy,setBusy]=useState(false);const submit=async e=>{e.preventDefault();setBusy(true);setError('');try{const body=mode==='login'?{phone:form.phone||'',password:form.password||''}:{name:form.name||'',phone:form.phone||'',password:form.password||'',village:form.village||''};onLogin(await api('/auth/'+mode,{method:'POST',body:JSON.stringify(body)}))}catch(err){setError(err.message)}finally{setBusy(false)}};return <main className="min-h-screen grid lg:grid-cols-[1.1fr_.9fr] bg-forest"><section className="relative hidden lg:flex flex-col justify-between overflow-hidden p-14 text-white"><div className="absolute -right-32 -top-32 h-96 w-96 rounded-full bg-leaf/30 blur-3xl"/><Logo/><div className="relative max-w-xl"><p className="mb-5 text-sm font-semibold uppercase tracking-[.25em] text-lime">Procurement, made clear</p><h1 className="text-6xl font-bold leading-[1.02]">Your harvest.<br/><span className="text-lime">Your time.</span></h1><p className="mt-7 max-w-md text-lg leading-8 text-white/70">Book a fair slot, follow your queue, and reach the centre when it is ready for you.</p></div><p className="text-sm text-white/45">AGRIVOS · Smart agriculture operations</p></section><section className="flex items-center justify-center bg-mist p-6"><div className="w-full max-w-md rounded-[28px] bg-white p-8 shadow-xl shadow-forest/10"><div className="mb-8 flex items-center gap-3 lg:hidden"><Logo compact/></div><p className="text-sm font-semibold uppercase tracking-[.2em] text-leaf">Welcome back</p><h2 className="mt-2 text-3xl font-bold">{mode==='login'?'Sign in to AGRIVOS':'Create your profile'}</h2><p className="mt-2 text-sm text-slate-500">{mode==='login'?'Keep your procurement day on track.':'A simple account for every booking.'}</p><div className="mt-7 flex rounded-xl bg-mist p-1"><button onClick={()=>setMode('login')} className={'flex-1 rounded-lg py-2 function AdminDashboard(){const[token]=useState(localStorage.getItem('agrivos_token')||''),[centres,setCentres]=useState([]),[queue,setQueue]=useState([]),[selected,setSelected]=useState(null),[error,setError]=useState(''),[cmd,setCmd]=useState(false);const load=async()=>{try{const data=await api('/admin/overview',{},token);setCentres(data);if(!selected&&data[0])setSelected(data[0])}catch(e){setError(e.message)}};const loadQueue=async centre=>{setSelected(centre);setQueue(await api('/admin/queue/'+centre.id,{},token))};useEffect(()=>{load()},[]);const next=b=>({booked:'arrived',arrived:'weighment',weighment:'quality_check',quality_check:'payment',payment:'completed'}[b.status]||null);const serveNext=async()=>{const target=queue.find(b=>next(b));if(!target)return;await api('/admin/booking/'+target.id+'/stage',{method:'POST',body:JSON.stringify({status:next(target)})},token);if(selected)loadQueue(selected);load()};const stage=async(bid,status)=>{await api('/admin/booking/'+bid+'/stage',{method:'POST',body:JSON.stringify({status})},token);if(selected)loadQueue(selected);load()};const refresh=async()=>{await load();if(selected)await loadQueue(selected)};const logout=()=>{localStorage.clear();location.href='/'};const totals=centres.reduce((a,c)=>({bookings:a.bookings+c.bookings_today,quantity:a.quantity+c.qty_today,queue:a.queue+c.live.in_queue}),{bookings:0,quantity:0,queue:0});return <div className="min-h-screen bg-mist"><header className="bg-forest text-white"><div className="mx-auto flex max-w-7xl items-center justify-between px-5 py-4 lg:px-8"><Logo compact/><div className="flex items-center gap-4"><a href="/admin/insights" className="rounded-lg border border-white/15 px-3 py-2 text-sm hover:bg-white/10">Insights</a><button onClick={()=>setCmd(true)} className="flex items-center gap-2 rounded-lg border border-white/15 px-3 py-2 text-sm font-semibold hover:bg-white/10">Command centre <Icon name="spark" size={15}/></button><button onClick={logout} className="rounded-lg border border-white/15 px-3 py-2 text-sm hover:bg-white/10">Sign out</button></div></div></header><main className="mx-auto max-w-7xl px-5 py-8 lg:px-8"><p className="text-xs font-bold uppercase tracking-[.2em] text-leaf">District operations</p><h1 className="mt-2 text-4xl font-bold">Command centre</h1>{error&&<p className="mt-4 rounded-xl bg-red-50 p-3 text-sm text-red-700">{error}. Sign in with the admin account first.</p>}<div className="mt-8 grid gap-4 sm:grid-cols-3"><div className="rounded-2xl bg-forest p-5 text-white"><p className="text-sm text-white/60">Farmers today</p><p className="mt-2 text-4xl font-bold">{totals.bookings}</p></div><div className="rounded-2xl bg-white p-5 ring-1 ring-slate-200"><p className="text-sm text-slate-500">Produce booked</p><p className="mt-2 text-4xl font-bold">{Math.round(totals.quantity)} <span className="text-base font-medium text-slate-400">kg</span></p></div><div className="rounded-2xl bg-white p-5 ring-1 ring-slate-200"><p className="text-sm text-slate-500">Waiting now</p><p className="mt-2 text-4xl font-bold">{totals.queue}</p></div></div><div className="mt-10 grid gap-6 lg:grid-cols-[.85fr_1.15fr]"><section><h2 className="text-xl font-bold">Live centres</h2><div className="mt-4 space-y-3">{centres.map(c=><button onClick={()=>loadQueue(c)} key={c.id} className={'w-full rounded-2xl bg-white p-4 text-left ring-1 '+(selected?.id===c.id?'ring-leaf':'ring-slate-200')}><div className="flex items-center justify-between"><div><p className="font-bold">{c.name}</p><p className="mt-1 text-sm text-slate-500">{c.district} · {c.crop}</p></div><Badge tone={c.live.congestion>1?'amber':'green'}>{c.live.congestion_label}</Badge></div><div className="mt-4 flex justify-between text-sm text-slate-500"><span>{c.live.in_queue} in queue</span><span>{c.bookings_today} bookings · {c.qty_today} kg</span></div></button>)}</div></section><section><div className="flex items-end justify-between"><div><h2 className="text-xl font-bold">Queue control</h2><p className="mt-1 text-sm text-slate-500">{selected?.name||'Select a centre'}</p></div></div><div className="mt-3 flex gap-2"><button onClick={serveNext} className="flex items-center gap-2 rounded-xl bg-leaf px-4 py-2.5 text-sm font-bold text-white hover:bg-forest"><Icon name="arrow" size={15}/> Serve next</button><button onClick={refresh} className="rounded-xl border border-slate-200 px-4 py-2.5 text-sm font-semibold text-slate-600 hover:bg-mist">Refresh</button></div><div className="mt-4 overflow-hidden rounded-2xl bg-white ring-1 ring-slate-200">{queue.length===0?<p className="p-8 text-center text-sm text-slate-500">Select a centre to view its live queue.</p>:queue.map(row=><div key={row.id} className="flex items-center gap-3 border-b border-slate-100 p-4 last:border-0"><div className="grid h-9 w-9 place-items-center rounded-xl bg-mist font-bold text-leaf">{row.queue_no}</div><div className="min-w-0 flex-1"><p className="truncate font-semibold">{row.farmer_name}</p><p className="text-xs text-slate-500">{row.token} · {row.status}</p></div><select value={row.status} onChange={e=>stage(row.id,e.target.value)} className="rounded-lg border border-slate-200 px-2 py-2 text-xs"><option value="arrived">Arrived</option><option value="weighment">Weighment</option><option value="quality_check">Quality</option><option value="payment">Payment</option><option value="completed">Completed</option></select></div>)}</div></section></div></main>{cmd&&<CommandCentre token={token} centre={selected} onClose={()=>setCmd(false)} onChanged={refresh}/>}</div>}

function App(){const[token,setToken]=useState(localStorage.getItem('agrivos_token')||''),[user,setUser]=useState(JSON.parse(localStorage.getItem('agrivos_user')||'null')),[centres,setCentres]=useState([]),[bookings,setBookings]=useState([]),[slots,setSlots]=useState([]),[selected,setSelected]=useState(null),[profile,setProfile]=useState(false),[toast,setToast]=useState('');const logout=()=>{localStorage.clear();setToken('');setUser(null)};const load=async()=>{if(!token)return;try{const[c,b]=await Promise.all([api('/centres',{},token),api('/bookings',{},token)]);setCentres(c);setBookings(b)}catch(e){if(e.message==='Invalid token'||e.message==='Missing token')logout()}};useEffect(()=>{load()},[token]);const openCentre=async c=>{setSelected(c);setSlots(await api('/centres/'+c.id+'/slots',{},token))};const book=async(slot,qty=100,vehicle='')=>{try{await api('/bookings',{method:'POST',body:JSON.stringify({slot_id:slot.id,quantity_kg:Number(qty),vehicle_no:vehicle})},token);setToast('Slot booked. Your token is ready.');setSelected(null);await load()}catch(e){setToast(e.message)}};const handleAI=a=>{const match=centres.find(c=>a.centre&&c.name.toLowerCase().includes(a.centre.toLowerCase()));if(match)openCentre(match);else setToast('Choose a centre below to finish HAL booking.')};if(!user)return <Auth onLogin={d=>{localStorage.setItem('agrivos_token',d.token);localStorage.setItem('agrivos_user',JSON.stringify(d.user));setToken(d.token);setUser(d.user)}}/>;if(user.role==='admin')return <AdminDashboard/>;return <div className="min-h-screen"><header className="bg-forest text-white"><div className="mx-auto flex max-w-7xl items-center justify-between px-5 py-4 lg:px-8"><Logo compact/><nav className="hidden items-center gap-7 text-sm text-white/65 md:flex"><a className="font-semibold text-white">Dashboard</a><a>My bookings</a><a>Help centre</a></nav><button onClick={()=>setProfile(true)} className="flex items-center gap-3 rounded-full border border-white/15 py-1.5 pl-1.5 pr-3 hover:bg-white/10"><span className="grid h-8 w-8 place-items-center rounded-full bg-lime font-bold text-forest">{user.name?.[0]}</span><span className="hidden text-sm font-semibold sm:block">{user.name}</span><Icon name="user" size={16}/></button></div></header><main className="mx-auto max-w-7xl px-5 py-8 lg:px-8 lg:py-11"><div className="fade mb-8 flex flex-col justify-between gap-4 md:flex-row md:items-end"><div><p className="text-sm font-semibold uppercase tracking-[.2em] text-leaf">Good morning, {user.name?.split(' ')[0]}</p><h1 className="mt-2 text-4xl font-bold tracking-tight lg:text-5xl">Let's get your market day sorted.</h1><p className="mt-3 text-slate-500">See available centres and choose a time that works for you.</p></div><div className="flex items-center gap-2 text-sm text-slate-500"><Icon name="calendar" size={16}/>{new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short'})}</div></div><HalAI token={token} centres={centres} onBook={handleAI}/><div className="mt-12 flex items-end justify-between"><div><p className="text-xs font-bold uppercase tracking-[.2em] text-leaf">Nearby</p><h2 className="mt-2 text-2xl font-bold">Procurement centres</h2></div><span className="text-sm text-slate-400">{centres.length} centres available</span></div><div className="mt-5 grid gap-4 md:grid-cols-2 lg:grid-cols-3">{centres.map(c=><article key={c.id} className="fade rounded-2xl border border-slate-200 bg-white p-5 shadow-sm hover:border-leaf/40 hover:shadow-md"><div className="flex items-start justify-between"><div className="grid h-11 w-11 place-items-center rounded-xl bg-mist text-leaf"><Icon name="pin"/></div><Badge tone={c.live.congestion>1?'amber':'green'}>{c.live.congestion_label}</Badge></div><h3 className="mt-5 text-lg font-bold">{c.name}</h3><p className="mt-1 text-sm text-slate-500">{c.district} · {c.crop}</p><div className="mt-5 flex items-center justify-between border-t border-slate-100 pt-4 text-sm"><span className="flex items-center gap-2 text-slate-500"><Icon name="clock" size={16}/>{c.open_time}–{c.close_time}</span><span className="font-semibold text-ink">{c.live.in_queue} in queue</span></div><button onClick={()=>openCentre(c)} className="mt-4 flex w-full items-center justify-center gap-2 rounded-xl bg-mist py-3 text-sm font-bold text-leaf hover:bg-lime">View available slots <Icon name="arrow" size={16}/></button></article>)}</div>{bookings.length>0&&<section className="mt-12"><p className="text-xs font-bold uppercase tracking-[.2em] text-leaf">Your bookings</p><h2 className="mt-2 text-2xl font-bold">Current bookings</h2><div className="mt-5 grid gap-4 lg:grid-cols-2">{bookings.slice(0,2).map(b=><div key={b.id} className="rounded-2xl bg-white p-5 shadow-sm ring-1 ring-slate-200"><div className="flex justify-between"><div><p className="text-xs uppercase tracking-wide text-slate-400">Digital token</p><p className="mt-1 text-3xl font-bold text-forest">{b.token}</p></div><Badge>{b.status}</Badge></div><div className="mt-5 flex flex-wrap gap-4 text-sm text-slate-500"><span className="flex items-center gap-2"><Icon name="pin" size={15}/>{b.centre_name}</span><span className="flex items-center gap-2"><Icon name="calendar" size={15}/>{b.slot_date} · {b.start_time}</span></div><div className="mt-4 rounded-xl bg-mist p-3 text-sm"><b>{b.queue_ahead}</b> people ahead · estimated wait <b>{Math.round(b.eta_minutes||0)} min</b></div></div>)}</div></section>}</main>{selected&&<SlotModal centre={selected} slots={slots} onClose={()=>setSelected(null)} onBook={book}/>} {profile&&<Profile user={user} onClose={()=>setProfile(false)} onLogout={logout}/>} {toast&&<button onClick={()=>setToast('')} className="fixed bottom-6 left-1/2 z-50 -translate-x-1/2 rounded-xl bg-ink px-5 py-3 text-sm font-semibold text-white shadow-xl">{toast}</button>}</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<>{window.location.pathname==='/admin/insights'?<InsightsDashboard/>:window.location.pathname==='/admin'?<AdminDashboard/>:<App/>}<BookingNavigation/><FarmerQuickActions/><AdminAccountNavigation/></>);
</script></body></html>
